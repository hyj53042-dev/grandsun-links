<title>그랜드썬 전기설계</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: 단선결선도 콘셉트 — 상단 모선(BUS)에서 각 링크가 피더(F-01, F-02…)로 분기 */
:root {
  --bg: #fbfcfe;
  --glow-1: #dfe9fb;
  --glow-2: #fde6e3;
  --panel: #ffffff;
  --ink: #293650;
  --muted: #5f6a7e;
  --line: #ccd2dd;
  --accent: #9a242d;
  --accent-soft: #f8e7e8;
  --logo-light: block;
  --logo-dark: none;
  --font-display: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141b28; --glow-1: #1f2d4a; --glow-2: #3a1f28; --panel: #1c2534; --ink: #e8ecf2; --muted: #98a3b5;
    --line: #2f3a4d; --accent: #e0606a; --accent-soft: #3a1d22;
    --logo-light: none; --logo-dark: block; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141b28; --glow-1: #1f2d4a; --glow-2: #3a1f28; --panel: #1c2534; --ink: #e8ecf2; --muted: #98a3b5;
  --line: #2f3a4d; --accent: #e0606a; --accent-soft: #3a1d22;
  --logo-light: none; --logo-dark: block; color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background-color: var(--bg);
  background-image:
    radial-gradient(ellipse 90% 45% at 15% 0%, var(--glow-1), transparent 70%),
    radial-gradient(ellipse 80% 40% at 100% 100%, var(--glow-2), transparent 70%);
  background-attachment: fixed;
  min-height: 100%;
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16.5px;
  line-height: 1.55;
  padding-inline: 16px;
  padding-block: 48px 64px;
}
.wrap { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px; }

header { display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; }
.logo { width: min(320px, 85%); height: auto; max-width: 100%; }
.logo-light { display: var(--logo-light); }
.logo-dark { display: var(--logo-dark); }
h1 {
  font-family: var(--font-display);
  font-weight: 700; font-size: 2.1rem; letter-spacing: -0.01em;
  margin: 0; text-wrap: balance;
}
.sub {
  font-family: var(--font-mono); font-size: 0.85rem;
  letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted);
  margin: 0;
}

/* 모선 + 피더 */
.bus { position: relative; padding-top: 18px; }
.bus::before {
  content: ""; position: absolute; top: 0; left: 0; right: 0; height: 4px;
  background: var(--ink); border-radius: 2px;
}
.bus-label {
  position: absolute; top: -20px; right: 0;
  font-family: var(--font-mono); font-size: 0.75rem; letter-spacing: 0.1em; color: var(--muted);
}
ul { list-style: none; margin: 0; padding: 0 0 0 22px; display: flex; flex-direction: column; gap: 12px; position: relative; }
ul::before {
  content: ""; position: absolute; left: 6px; top: -18px; bottom: 30px;
  width: 2px; background: var(--line);
}
li { position: relative; }
li::before {
  content: ""; position: absolute; left: -16px; top: 50%; width: 16px; height: 2px; background: var(--line);
}
li::after {
  content: ""; position: absolute; left: -20px; top: calc(50% - 4px);
  width: 6px; height: 6px; border-radius: 50%; background: var(--bg); border: 2px solid var(--line);
}

a.link {
  display: flex; align-items: center; gap: 14px;
  padding: 16px 18px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 10px;
  color: inherit; text-decoration: none;
  transition: border-color .15s, transform .15s, background .15s;
}
a.link:hover { border-color: var(--accent); transform: translateX(3px); }
a.link:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.tag {
  flex: none;
  font-family: var(--font-mono); font-size: 0.82rem; font-weight: 500;
  padding: 3px 7px; border-radius: 5px;
  background: var(--accent-soft); color: var(--accent);
  font-variant-numeric: tabular-nums;
}
.txt { min-width: 0; flex: 1; display: flex; flex-direction: column; }
.name { font-weight: 700; font-size: 1.18rem; }
.desc { font-size: 0.92rem; color: var(--muted); }
.host {
  font-family: var(--font-mono); font-size: 0.8rem; color: var(--muted);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.arrow { flex: none; color: var(--muted); font-family: var(--font-mono); }
a.link:hover .arrow { color: var(--accent); }

footer {
  text-align: center; font-family: var(--font-mono);
  font-size: 0.78rem; letter-spacing: 0.08em; color: var(--muted);
}
@media (prefers-reduced-motion: reduce) { a.link { transition: none; } a.link:hover { transform: none; } }
</style>

<div class="wrap">
  <header>
    <img class="logo logo-light" src="logo.png" alt="GRANDSUN" width="756" height="108">
    <img class="logo logo-dark" src="logo-dark.png" alt="GRANDSUN" width="756" height="108">
    <h1>그랜드썬 전기설계</h1>
    <p class="sub">Grandsun · Electrical Engineering</p>
  </header>

  <nav class="bus" aria-label="링크 목록">
    <span class="bus-label">MAIN BUS</span>
    <ul id="list"></ul>
  </nav>

  <footer id="count"></footer>
</div>

<script>
/* ============================================================
   링크 추가 방법: 아래 LINKS 배열에 한 줄씩 추가하세요.
   { name: "표시 이름", url: "https://...", desc: "설명(선택)" },
   순서대로 F-01, F-02 … 번호가 자동으로 붙습니다.
   ============================================================ */
const LINKS = [
  { name: "전기설계 실무자 회의", url: "https://claude.ai/artifact/13RBgjcJANkTMdmEvCHrkB" },
  { name: "설계 플랫폼",      url: "https://grandsun.hyj53042.workers.dev/" },
  { name: "공사계획신고현황", url: "https://hyj53042-dev.github.io/-construction-notice-tracker/" },
];

const list = document.getElementById("list");
LINKS.forEach((l, i) => {
  let host = l.url;
  try { const u = new URL(l.url); host = u.host + u.pathname.replace(/\/$/, ""); } catch (e) {}
  const li = document.createElement("li");
  const a = document.createElement("a");
  a.className = "link"; a.href = l.url; a.target = "_blank"; a.rel = "noopener";
  const tag = document.createElement("span");
  tag.className = "tag"; tag.textContent = "F-" + String(i + 1).padStart(2, "0");
  const txt = document.createElement("span"); txt.className = "txt";
  const name = document.createElement("span"); name.className = "name"; name.textContent = l.name;
  txt.appendChild(name);
  if (l.desc) { const d = document.createElement("span"); d.className = "desc"; d.textContent = l.desc; txt.appendChild(d); }
  const h = document.createElement("span"); h.className = "host"; h.textContent = host; txt.appendChild(h);
  const arr = document.createElement("span"); arr.className = "arrow"; arr.textContent = "→"; arr.setAttribute("aria-hidden", "true");
  a.append(tag, txt, arr); li.appendChild(a); list.appendChild(li);
});
document.getElementById("count").textContent = "FEEDERS · " + LINKS.length;
</script>
